<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>
        {% if page.recipe %}
            {{ page.recipe }} |
        {% elsif page.title %}
            {{ page.title }} |
        {% endif %}
        {{ site.title }}
    </title>

    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>

<body>

<header class="site-header">
    <div class="site-header-inner">
        <a class="site-title" href="{{ '/' | relative_url }}">
            {{ site.title }}
        </a>
    </div>
</header>

<main class="site-main">
    {{ content }}
</main>

<script src="{{ '/assets/js/recipe-search.js' | relative_url }}"></script>
<script src="{{ '/assets/js/ingredient-conversions.js' | relative_url }}"></script>
<script src="{{ '/assets/js/ingredient-converter.js' | relative_url }}"></script>
<script src="{{ '/assets/js/recipe-ingredients.js' | relative_url }}"></script>
    
</body>

</html>
